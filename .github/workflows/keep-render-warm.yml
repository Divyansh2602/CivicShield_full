name: Keep Render Warm

on:
  # No schedule on purpose. Render's free tier gives 750 instance-hours/month
  # and SUSPENDS the service until next month once they're used up. Spun-down
  # services consume zero hours, so pinging it 24/7 to keep it warm is exactly
  # what exhausts the quota and gets it suspended. Let it spin down; the report
  # download already retries through the ~50s cold start.
  # This stays as a MANUAL trigger only — run it from the Actions tab a minute
  # before a live demo to pre-warm the backend.
  workflow_dispatch:

concurrency:
  group: keep-render-warm
  cancel-in-progress: true

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve keep-warm target
        id: target
        env:
          RENDER_HEALTHCHECK_URL: ${{ secrets.RENDER_HEALTHCHECK_URL }}
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          # Prefer a secret if configured; otherwise fall back to the known
          # public backend URL so the keep-warm never breaks on a missing secret.
          if [ -n "$RENDER_HEALTHCHECK_URL" ]; then
            url="$RENDER_HEALTHCHECK_URL"
          elif [ -n "$RENDER_BACKEND_URL" ]; then
            url="${RENDER_BACKEND_URL%/}/healthz"
          else
            url="https://civicshield-hack.onrender.com/healthz"
          fi

          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Resolved keep-warm target: $url"

      - name: Ping backend health endpoint
        env:
          TARGET_URL: ${{ steps.target.outputs.url }}
        run: |
          curl --fail-with-body --silent --show-error \
            --location \
            --max-time 15 \
            --retry 15 \
            --retry-delay 10 \
            --retry-all-errors \
            --write-out "\nHTTP %{http_code}\n" \
            "$TARGET_URL"
